name: Bug report
description: Something else went wrong
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The command you ran and its full output
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: JVMAudit version
      description: Output of `jvmaudit --version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows Server 2019, Ubuntu 24.04, macOS 15
    validations:
      required: true
