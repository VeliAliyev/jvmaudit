# JVMAudit product catalogue
#
# Maps what an installation reports about itself onto a product id. The license rules in
# oracle-license-rules.yaml are written against these ids.
#
# A product may list SEVERAL alternative match blocks under `match:`; the product is recognised
# when ANY of them matches. That is not a convenience - it is how an installation with no readable
# release file still gets identified, because then the only evidence is the `java -version` banner.
#
# Matching inputs (all optional, all case-insensitive):
#   implementor          - the IMPLEMENTOR field of the JVM's `release` file, exact match
#   implementorVersion   - a substring of IMPLEMENTOR_VERSION
#   runtimeName          - a substring of the "... Runtime Environment ..." line of `java -version`
#   requiresJavaTm       - true  => only matches a build whose `java -version` says "Java(TM)"
#                          false => only matches a build known NOT to say "Java(TM)"
#                          absent => not considered
# Within one match block every condition stated must be satisfied. Products are tried in the order
# they appear here, and the first match wins, so put the specific ones first.
#
# matchConfidence records how the match strings themselves were established:
#   verified   - read off a real installation or an official vendor document (see matchEvidence)
#   unverified - taken from vendor documentation or community sources, not yet confirmed against a
#                real artifact. M2 confirms these against downloaded artifacts.

schemaVersion: 1
catalogVersion: "2026.08.30"

products:

  - id: oracle-graalvm
    displayName: "Oracle GraalVM"
    vendor: "Oracle"
    oracle: true
    match:
      - implementor: "Oracle Corporation"
        implementorVersion: "Oracle GraalVM"
      - runtimeName: "Oracle GraalVM"
    matchConfidence: unverified
    citations:
      - title: "GraalVM Free Terms and Conditions (GFTC)"
        url: "https://www.oracle.com/downloads/licenses/graal-free-license.html"

  - id: graalvm-ce
    displayName: "GraalVM Community Edition"
    vendor: "GraalVM Community"
    oracle: false
    match:
      - implementorVersion: "GraalVM CE"
      - runtimeName: "GraalVM CE"
    matchConfidence: unverified
    citations:
      - title: "GraalVM Community Edition builds (GPLv2+CPE)"
        url: "https://github.com/graalvm/graalvm-ce-builds"

  - id: oracle-jdk
    displayName: "Oracle JDK / Oracle JRE"
    vendor: "Oracle"
    oracle: true
    match:
      - implementor: "Oracle Corporation"
        requiresJavaTm: true
      - runtimeName: "Java(TM) SE Runtime Environment"
    matchConfidence: verified
    matchEvidence: >-
      Read from a real Oracle JDK 17.0.11 installation on 2026-08-30: release file has
      IMPLEMENTOR="Oracle Corporation" with no IMPLEMENTOR_VERSION, and `java -version` prints
      "Java(TM) SE Runtime Environment (build 17.0.11+7-LTS-207)".
    citations:
      - title: "Oracle Java SE Licensing FAQ"
        url: "https://www.oracle.com/java/technologies/javase/jdk-faqs.html"

  - id: oracle-openjdk
    displayName: "Oracle OpenJDK build (jdk.java.net)"
    vendor: "Oracle"
    oracle: true
    match:
