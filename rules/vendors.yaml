        requiresJavaTm: false
    matchConfidence: verified
    matchEvidence: >-
      Read from a real Oracle OpenJDK 21.0.2 installation on 2026-08-30: release file has
      IMPLEMENTOR="Oracle Corporation" with no IMPLEMENTOR_VERSION, and `java -version` prints
      "OpenJDK Runtime Environment (build 21.0.2+13-58)".
    citations:
